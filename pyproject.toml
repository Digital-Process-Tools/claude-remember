[tool.pytest.ini_options]
testpaths = ["tests"]
# `-rs` prints the reason behind every skip. A skip in this suite is a checker
# saying it could not answer — the floor-bash parse gate naming the constructs
# that went unchecked, the timestamp comparison naming the builtin this bash
# does not have — and that contract only pays for itself if the reason reaches a
# human. Rendered as a bare `s`, a green run with silent skips is visually
# identical to a green run that checked everything (#306).
addopts = "-rs --durations=25 --cov=pipeline --cov-report=term-missing --cov-fail-under=80"

# #1014: a job cancelled by its own job-level timeout-minutes writes NO log at
# all, so a hung test used to be unidentifiable. faulthandler_timeout (builtin
# to pytest, no new dependency) dumps every thread's traceback -- naming the
# hung test -- once any single test runs longer than this. Sized from a green
# windows-latest run's own --durations=25 output (run 38091996750, job
# 114330142530): the slowest single test there was 30.14s, so 900s leaves
# ~30x margin over normal variance.
#
# #1014 round 2: this PR's OWN CI hit the exact failure it set out to fix
# (run 38122057767, job 114418645594, pytest windows-latest/3.9): "Run
# tests" ran ~33.6 min -- past the step's own 25min timeout below -- yet
# the job ended `cancelled`, not a failed step, and wrote NO log at all.
# Neither the step's nor the job's own timeout-minutes visibly stopped the
# hang; the leading theory is a Windows runner cannot always kill a
# process tree held by a hung grandchild (a green sibling leg of the same
# run, job 114418645663, had to force-terminate an orphaned bash.exe/
# wscript.exe at teardown -- see
# tests/test_windows_real_wscript_v0_42_3_1002.py's own cleanup fixture).
# faulthandler_exit_on_timeout makes the dump kill the pytest PROCESS
# itself (_exit, bypassing whatever held it) well inside this same 900s
# bound, so a hang becomes a failed step with its traceback in a log that
# survives, rather than depending on a runner-level kill that was already
# observed not to fire.
#
# Compatible with --cov (faulthandler is independent of coverage collection)
# and with pytest-xdist if it is ever added (this repo currently has none,
# confirmed by a repo-wide grep); both ini options are per-worker/per-process
# settings either way.
faulthandler_timeout = 20
faulthandler_exit_on_timeout = true
