name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Fetch origin/main
        # actions/checkout on a pull_request event checks out the merge ref
        # with no local origin/main branch ref at all, so anything comparing
        # against origin/main (tests/test_case_divergence_298.py's byte-pin
        # guard) cannot resolve its base and would otherwise have to skip
        # itself -- which is exactly how that guard went unexercised on
        # every pull_request run (#442). Fetch it explicitly and cheaply;
        # depth 1 is enough since only the tip of main is compared against.
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      - name: Install Windows tzdata
        if: runner.os == 'Windows'
        run: pip install tzdata
      # Defender's real-time scanner walks every file this job touches on the runner's
      # own disk. Today the Windows legs barely notice: 92 modules blanket-skip on win32
      # (#497), so they create almost no temp files and run faster than the Linux and
      # macOS legs. The exclusion is here for when those skips lift -- at that point the
      # Windows legs start doing the same file-heavy work, and the scanner is charged per
      # fixture. Excluding the checkout and the runner temp directory removes that tax
      # without touching what any test asserts; the exclusion lives only in the ephemeral
      # runner VM. Ported from claude-jit-context#310, where it was measured, not guessed.
      - name: Exclude the checkout and temp dir from Windows Defender scanning
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
      - name: Run tests
        run: pytest
