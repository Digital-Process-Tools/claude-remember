name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Per branch or pull request, superseding. A second push to the same head cancels the
# run it replaced rather than leaving two full 12-leg matrices racing each other on the
# same commit range.
#
# `github.ref` is `refs/pull/N/merge` on a `pull_request` event and `refs/heads/main` on a
# push, so the group is one pull request or one branch wide -- never constant, which would
# serialise unrelated pull requests against each other.
#
# Cancellation is deliberately limited to pull requests. A push to `main` is the run a
# release gate reads, and `cancelled` is not `success`: cancelling a main run to favour a
# newer one leaves the older commit with no verdict at all, which is the absence this
# repo's own CLAUDE.md warns reads exactly like a pass.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Fetch origin/main
        # actions/checkout on a pull_request event checks out the merge ref
        # with no local origin/main branch ref at all, so anything comparing
        # against origin/main (tests/test_case_divergence_298.py's byte-pin
        # guard) cannot resolve its base and would otherwise have to skip
        # itself -- which is exactly how that guard went unexercised on
        # every pull_request run (#442). Fetch it explicitly and cheaply;
        # depth 1 is enough since only the tip of main is compared against.
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          # pyyaml: tests/test_clones_badge_workflow.py (#828) parses
          # .github/workflows/clones-badge.yml with yaml.safe_load to check
          # its shape (SHA-pinned actions, permissions, triggers) rather than
          # regex-matching a hand-rolled YAML subset.
          pip install pytest pytest-cov pyyaml
      - name: Install Windows tzdata
        if: runner.os == 'Windows'
        run: pip install tzdata
      # Defender's real-time scanner walking every file this job touches would be a
      # real cost in principle, but as of #692, a state read on the windows-latest
      # image this ran against then showed real-time protection already off and
      # the whole checkout drive already excluded before this step did anything
      # (removing the step entirely produced the same timings as keeping it --
      # runner noise, no trend). That reading is a snapshot of one image, not a
      # standing guarantee -- runner images change -- so the step does not repeat
      # the claim as durable fact. It reports its own premise instead: the log
      # below says whether the exclusion is doing anything on the image of the
      # day, read before the exclusions are added so the printed state is the
      # runner's own, not this step's.
      - name: Report Defender state, then exclude the checkout and temp dir
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $status = Get-MpComputerStatus
          $prefs = Get-MpPreference
          Write-Host "RealTimeProtectionEnabled: $($status.RealTimeProtectionEnabled)"
          Write-Host "ExclusionPath: $($prefs.ExclusionPath -join ', ')"
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
      - name: Run tests
        run: pytest

  # #900: each hooks.json-registered hook script is inlined and
  # comment-stripped for the release tree (compile_hooks.py) so the
  # Anthropic plugin directory's release-preview validator -- which never
  # follows a `source`/`.` statement into a second file -- stops holding
  # these four scripts as COMMAND_SCRIPT_NOT_FOLLOWED. The compiled form
  # must behave exactly like the sourced one, so this job compiles the four
  # hooks in place on a fresh checkout and runs the WHOLE suite against
  # that compiled tree, on every OS the plain `pytest` job above already
  # covers -- a hook test file's own content decides what it actually
  # exercises; running everything is what proves nothing *else* broke.
  hook-tests-compiled:
    name: hook tests (compiled) / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Fetch origin/main
        # Same reasoning as the plain pytest job above (#442): a
        # pull_request checkout has no local origin/main ref, and a test
        # that compares against it would otherwise skip itself unnoticed.
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pyyaml
      - name: Install Windows tzdata
        if: runner.os == 'Windows'
        run: pip install tzdata
      - name: Compile the four hooks.json-registered hooks in place (#900)
        # `python`, not `python3`: every other python3 invocation anywhere
        # in this repo's CI runs on ubuntu-latest only (release-branch.yml,
        # oss-changelog.yml); this is the first python call on a Windows
        # runner in this workflow, and actions/setup-python does not
        # reliably provide a `python3` shim on Windows the way it does on
        # Linux/macOS. `python` matches the convention the pip-install step
        # above already uses on this same matrix.
        run: python .github/scripts/compile_hooks.py --repo . --apply
      - name: Run the full suite against the compiled hooks
        run: pytest
