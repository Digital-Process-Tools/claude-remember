name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Per branch or pull request, superseding. A second push to the same head cancels the
# run it replaced rather than leaving two full 12-leg matrices racing each other on the
# same commit range.
#
# `github.ref` is `refs/pull/N/merge` on a `pull_request` event and `refs/heads/main` on a
# push, so the group is one pull request or one branch wide -- never constant, which would
# serialise unrelated pull requests against each other.
#
# Cancellation is deliberately limited to pull requests. A push to `main` is the run a
# release gate reads, and `cancelled` is not `success`: cancelling a main run to favour a
# newer one leaves the older commit with no verdict at all, which is the absence this
# repo's own CLAUDE.md warns reads exactly like a pass.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - name: Fetch origin/main
        # actions/checkout on a pull_request event checks out the merge ref
        # with no local origin/main branch ref at all, so anything comparing
        # against origin/main (tests/test_case_divergence_298.py's byte-pin
        # guard) cannot resolve its base and would otherwise have to skip
        # itself -- which is exactly how that guard went unexercised on
        # every pull_request run (#442). Fetch it explicitly and cheaply;
        # depth 1 is enough since only the tip of main is compared against.
        run: git fetch --no-tags --depth=1 origin main:refs/remotes/origin/main
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
      - name: Install Windows tzdata
        if: runner.os == 'Windows'
        run: pip install tzdata
      # Defender's real-time scanner walking every file this job touches would be a
      # real cost in principle, but #692 found it is not currently one: on the
      # windows-latest image this runs against, a state read showed real-time
      # protection already off and the whole checkout drive already excluded before
      # this step does anything (removing the step entirely produced the same timings
      # as keeping it -- runner noise, no trend). Runner images change, so the step
      # stays and reports its own premise instead of asserting it: the log below says
      # whether the exclusion is doing anything on the image of the day, rather than
      # claiming a tax that nothing here can show was ever charged.
      - name: Report Defender state, then exclude the checkout and temp dir
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $status = Get-MpComputerStatus
          $prefs = Get-MpPreference
          Write-Host "RealTimeProtectionEnabled: $($status.RealTimeProtectionEnabled)"
          Write-Host "ExclusionPath: $($prefs.ExclusionPath -join ', ')"
          Add-MpPreference -ExclusionPath "${{ github.workspace }}"
          Add-MpPreference -ExclusionPath "$env:RUNNER_TEMP"
      - name: Run tests
        run: pytest
